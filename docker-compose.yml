services:
  rcrouter:
    build: .
    image: ${RCROUTER_IMAGE:-ghcr.io/rezkycodes/rcrouter:latest}
    container_name: ${RCROUTER_CONTAINER_NAME:-rcrouter}
    restart: always
    ports:
      - "20128:20128"
    volumes:
      - 9router-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787
    depends_on:
      - headroom

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: always
    ports:
      - "8787:8787"

volumes:
  # Keep the historical volume name so an upgrade does not orphan existing
  # SQLite data; the application itself migrates ~/.9router into RcRouter.
  9router-data:
    name: 9router-data
