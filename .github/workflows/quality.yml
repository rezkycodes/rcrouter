name: Quality

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # tests/unit/codex-stt-*.test.js convert real WAV audio through the ffmpeg binary
      # (open-sse/handlers/codexSttAudio.js answers 503 "ffmpeg is required" without it).
      - name: Ensure ffmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Quality regression gates
        run: pnpm check

      - name: Production build
        run: pnpm run build

      - name: Migration and rollback drill
        run: pnpm run release:migration-drill

  container-smoke:
    name: Container smoke
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Container liveness smoke
        env:
          CI: "true"
        run: node scripts/container-smoke.mjs

  cloud-worker-smoke:
    name: Cloud Worker bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Worker dependencies
        working-directory: cloud
        run: pnpm --ignore-workspace install --frozen-lockfile --ignore-scripts

      - name: Deterministic Worker smoke fixture
        run: pnpm run release:cloud-smoke

      - name: Wrangler bundle dry-run
        working-directory: cloud
        run: ./node_modules/.bin/wrangler deploy --dry-run --config wrangler.toml
